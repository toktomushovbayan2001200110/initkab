{% extends "campus/base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h1>{{ title }}</h1>
<div class="card" style="max-width:560px;margin-top:14px">
  <form method="post" class="stack">{% csrf_token %}{{ form.as_p }}
    <div class="row end"><button class="primary">Сохранить</button>{% if is_new %}<button name="add_more" value="1">Сохранить и добавить ещё</button>{% endif %}<a class="btn" href="{% url back %}">Отмена</a></div>
  </form>
</div>
{% endblock %}
