# Локальный запуск: docker compose up -d --build  →  http://localhost:8000/
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: initkab
      POSTGRES_USER: initkab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-initkab-local}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U initkab -d initkab"]
      interval: 3s
      timeout: 3s
      retries: 20
  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: initkab
      POSTGRES_USER: initkab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-initkab-local}
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    ports:
      - "8000:8000"
volumes:
  pgdata:
